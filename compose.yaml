services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkedup
      POSTGRES_DB: linkedup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "linkedup", "-d", "linkedup"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://linkedup:${POSTGRES_PASSWORD}@db:5432/linkedup
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      DEMO_MODE: "false"
      BETA_INVITE_ONLY: ${BETA_INVITE_ONLY:-true}
      BETA_INVITE_EMAILS: ${BETA_INVITE_EMAILS:-}
      MODERATOR_EMAILS: ${MODERATOR_EMAILS:-}
      LEARNING_INSTRUCTOR_EMAILS: ${LEARNING_INSTRUCTOR_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-12}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 8s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      target: web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  database:
  caddy_data:
  caddy_config:
